[profile]
name = "default"

[target]
root = "~/.personal-knowledge-runtime"

[storage.knowledge]
provider = "local"
namespace = "personal-knowledge"
prefix = "knowledge"

[storage.large]
provider = "local"
namespace = "personal-knowledge"
prefix = "large"

[report.server]
port = 8765

[migration]
# migrate_knowledge.pyの移行元。ホーム(~)からの相対パスだけを指定する。
# 例: sources = ["Documents/notes"]
sources = []
