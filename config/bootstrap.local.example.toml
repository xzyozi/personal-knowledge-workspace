[profile]
name = "default"

[target]
root = "~/.personal-knowledge-runtime"
# AIツールにグローバル設定として読ませる場合は、ホーム直下へ展開する。
# ホームをtargetにするには、allow_home = trueの明示が必要。
# 展開はconfig/bootstrap.tomlの許可リストの新規作成だけで、既存ファイルは上書きしない。
# root = "~/"
# allow_home = true

[storage.knowledge]
provider = "local"
namespace = "personal-knowledge"
prefix = "knowledge"

[storage.large]
provider = "local"
namespace = "personal-knowledge"
prefix = "large"

[report.server]
port = 8765

[migration]
# migrate_knowledge.pyの移行元。ホーム(~)からの相対パスだけを指定する。
# 例: sources = ["Documents/notes"]
sources = []
