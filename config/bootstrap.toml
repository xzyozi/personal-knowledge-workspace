schema_version = 1
default_profile = "default"

[exit_codes]
success = 0
conflict = 10
configuration_error = 20
safety_error = 30
internal_error = 1

[messages]
success = "bootstrapを完了しました"
conflict = "既存ファイルとの衝突があります"
configuration_error = "bootstrap設定が不正です"
safety_error = "許可されていない対象またはパスです"
internal_error = "予期しない内部エラーが発生しました"
target_missing = "対象がありません"
same_hash = "同一内容です"
destination_is_directory = "保存先がディレクトリです"
unmanaged_existing_file = "未管理の既存ファイルと衝突しました"
source_managed_block_missing = "テンプレート側に管理ブロックがありません"
managed_block_missing = "既存ファイルに管理ブロックがありません"
managed_block_modified = "管理ブロックがユーザーによって変更されています"
managed_block_not_utf8 = "管理ブロックをUTF-8として読めません"
same_managed_block = "管理ブロックは同一です"
managed_block_updated = "管理ブロックを更新します"
managed_block_appended = "管理ブロックを末尾に追記します"
managed_block_incomplete = "管理ブロックの終了マーカーがありません"
template_updated = "テンプレートの更新を反映します"
user_modified = "利用者が変更したため更新しません"
no_apply_record = "適用記録がないため更新しません"

[report]
directory = "reports"
html = "bootstrap-report.html"
json = "bootstrap-report.json"
reverse_json = "reverse-bootstrap-report.json"
migrate_json = "migrate-knowledge-report.json"
state = "bootstrap-state.json"

[report.server]
port = 8765

[migration]
# 移行元として指定できない固定の拒否リスト。走査中に見つかった同名ディレクトリも取り込まない。
deny = [
  ".ssh",
  ".aws",
  ".azure",
  ".gcloud",
  ".gnupg",
  ".docker",
  ".kube",
  ".config",
  ".gemini",
  ".claude",
  ".codex",
  ".kiro",
  ".git",
  "AppData",
  "node_modules",
  "__pycache__",
  ".venv",
]

[profiles.default]
description = "共有入口、ナレッジ索引、共通ルール"

[[profiles.default.targets]]
id = "common-agents"
source = "AGENTS.md"
destination = "AGENTS.md"
mode = "update-if-unmodified"
revision = 1

[[profiles.default.targets]]
id = "gemini-entry"
source = "GEMINI.md"
destination = "GEMINI.md"
mode = "update-if-unmodified"
revision = 1

