<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bootstrap Report</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { margin: 0; padding: 2rem; background: #f5f7fb; color: #1f2937; }
    main { max-width: 1100px; margin: 0 auto; }
    .card { background: white; border-radius: 12px; padding: 1.25rem; margin-bottom: 1rem; box-shadow: 0 2px 12px #0001; }
    .status { display: inline-block; border-radius: 999px; padding: .25rem .7rem; font-weight: 700; }
    .status.success { background: #dcfce7; color: #166534; }
    .status.conflict, .status.error { background: #fee2e2; color: #991b1b; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; border-bottom: 1px solid #e5e7eb; padding: .65rem; vertical-align: top; }
    code { word-break: break-all; }
    .action-create { color: #166534; }
    .action-skip { color: #6b7280; }
    .action-update { color: #1d4ed8; }
    .action-conflict, .action-error { color: #b91c1c; font-weight: 700; }
    .muted { color: #6b7280; }
    @media (prefers-color-scheme: dark) {
      body { background: #111827; color: #e5e7eb; }
      .card { background: #1f2937; }
      th, td { border-color: #374151; }
      .muted { color: #9ca3af; }
    }
  </style>
</head>
<body>
<main>
  <h1>Bootstrap Report</h1>
  <div id="content" class="card">JSONレポートを読み込んでいます...</div>
</main>
<script>
(() => {
  const content = document.getElementById('content');
  const escapeText = value => String(value ?? '');
  const statusClass = status => status === 'success' ? 'success' : 'conflict';
  const render = report => {
    const items = Array.isArray(report.items) ? report.items : [];
    const rows = items.map(item => `
      <tr>
        <td class="action-${escapeText(item.action)}">${escapeText(item.action)}</td>
        <td><code>${escapeText(item.destination)}</code></td>
        <td>${escapeText(item.message || item.reason)}</td>
        <td><code>${escapeText(item.id)}</code></td>
      </tr>`).join('');
    content.innerHTML = `
      <p><span class="status ${statusClass(report.status)}">${escapeText(report.status)}</span></p>
      <p>${escapeText(report.message)}</p>
      <p class="muted">profile: ${escapeText(report.profile)} / generated: ${escapeText(report.generated_at)}</p>
      <p class="muted">exit code: ${escapeText(report.exit_code)}</p>
      <table>
        <thead><tr><th>Action</th><th>Destination</th><th>Message</th><th>ID</th></tr></thead>
        <tbody>${rows || '<tr><td colspan="4">対象項目はありません</td></tr>'}</tbody>
      </table>`;
  };
  const load = async () => {
    try {
      const response = await fetch('./bootstrap-report.json?ts=' + Date.now(), { cache: 'no-store' });
      if (!response.ok) throw new Error('HTTP ' + response.status);
      render(await response.json());
    } catch (error) {
      content.textContent = 'JSONレポートを読み込めません: ' + error.message;
    }
  };
  load();
  setInterval(load, 3000);
})();
</script>
</body>
</html>
