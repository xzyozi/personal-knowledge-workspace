name: Validate workspace

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate workspace and bootstrap fixtures
    strategy:
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate structure
        run: python scripts/validate_structure.py

      - name: Validate bootstrap fixtures
        run: python scripts/test_bootstrap.py

      - name: Validate reverse-bootstrap fixtures
        run: python scripts/test_reverse_bootstrap.py

      - name: Validate migrate-knowledge fixtures
        run: python scripts/test_migrate_knowledge.py
